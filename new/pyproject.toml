[project]
name = "ne-connect"
version = "0.1.0"
description = "Cross-database search over Nebraska public records, for journalists."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "polars>=1.0",
  "duckdb>=1.0",
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["resolve*", "scrapers*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
